# O projeto não tem dependência npm (ADR 0001) — o único "pacote" externo são as
# ações oficiais do GitHub usadas na esteira. Mantê-las atualizadas é trabalho do robô.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
    labels: ["esteira"]
